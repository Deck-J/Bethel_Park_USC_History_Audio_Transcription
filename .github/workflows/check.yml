name: check

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: recording gate
        run: python3 bin/check.py

      - name: generated docs are current
        run: |
          python3 bin/gen_collection.py
          python3 bin/gen_names.py
          git diff --exit-code docs/COLLECTION.md docs/NAMES.md
